  /events:
    get:
      operationId: listEvents
      tags:
      - Events
      summary: Каталог опубликованных встреч
      description: 'Только PUBLISHED. organizationId и organizerAccountId взаимоисключающие. q — название/описание/направление;
        city — точное нормализованное совпадение. Пустые q/city не фильтруют. from включительно, to исключительно;
        без них прошлые встречи не исключаются автоматически. DEC-19: dateFrom включительно и dateTo исключительно
        — календарные даты YYYY-MM-DD в IANA-зоне каждого события, не устройства/сервера. Обе границы требуют
        dateTo > dateFrom; иначе INVALID_REQUEST. Можно сочетать с from/to: все условия применяются через AND
        до LIMIT, входят в курсор.'
      security: []
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
