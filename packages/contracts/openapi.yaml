      summary: Справочник спортивных направлений
      description: Только APPROVED, полный небольшой список, сортировка normalized_name, id. PENDING/REJECTED
        не перечисляются, но их названия видны в опубликованных встречах и доступны для использования. Это
        фильтр общего списка выбора, не запрет вида спорта.
      security: []
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
