                    isBlocked: false
        '400':
          $ref: '#/components/responses/400'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
      x-access: public
      x-requirements: []
      x-error-codes:
        '400':
        - INVALID_REQUEST
        '404':
        - NOT_FOUND
        '500':
        - INTERNAL_ERROR
      parameters:
      - $ref: '#/components/parameters/accountId'
  /events/{eventId}/cover:
    put:
      operationId: setEventCover
      tags:
      - Media
      summary: Установить проверенный SVG-фон
      description: Только автор опубликованного события. SVG максимум 131072 UTF-8 байт до/после нормализации;
        JSON-тело максимум 1048576 байта. Старый фон сохраняется при ошибке.
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverSelection'
              examples:
                setEventCoverSuccess:
                  value:
                    coverUrl: /api/v1/events/00000002-0000-4000-8000-000000000001/cover
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '413':
          $ref: '#/components/responses/413'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '500':
          $ref: '#/components/responses/500'
      x-access: event-owner
      x-requirements: []
      x-error-codes:
        '400':
        - INVALID_REQUEST
        '401':
        - AUTH_REQUIRED
        - SESSION_EXPIRED
        '403':
        - CSRF_REJECTED
        - ACCOUNT_BLOCKED
        '404':
        - NOT_FOUND
        '409':
        - EVENT_UNAVAILABLE
        '413':
        - PAYLOAD_TOO_LARGE
        '415':
        - UNSUPPORTED_MEDIA_TYPE
        '422':
        - VALIDATION_ERROR
        '500':
        - INTERNAL_ERROR
      parameters:
      - $ref: '#/components/parameters/eventId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoverInput'
            examples:
              setEventCoverSuccess:
                value:
                  svg: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300"><rect width="800" height="300"
                    fill="#D92D3A"/></svg>
      x-requires-origin: true
      x-scope: MEDIA-01
      x-max-body-bytes: 1048576
    delete:
      operationId: deleteEventCover
      tags:
      - Media
      summary: Сбросить SVG-фон
      description: Только автор PUBLISHED; повторный сброс даёт 204. Снятое событие даёт 409 EVENT_UNAVAILABLE.
      security:
      - sessionCookie: []
      responses:
        '204':
          description: Успешно; тело отсутствует.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '404':
          $ref: '#/components/responses/404'
        '409':
          $ref: '#/components/responses/409'
        '500':
          $ref: '#/components/responses/500'
      x-access: event-owner
      x-requirements: []
      x-error-codes:
        '400':
        - INVALID_REQUEST
        '401':
        - AUTH_REQUIRED
        - SESSION_EXPIRED
        '403':
        - CSRF_REJECTED
        - ACCOUNT_BLOCKED
        '404':
        - NOT_FOUND
        '409':
        - EVENT_UNAVAILABLE
        '500':
        - INTERNAL_ERROR
      parameters:
      - $ref: '#/components/parameters/eventId'
      x-requires-origin: true
      x-scope: MEDIA-01
    get:
      operationId: getEventCover
      tags:
      - Media
      summary: Прочитать SVG-фон
      description: Доступ как к карточке. Отсутствующий фон — 404. Ответ image/svg+xml, nosniff и CSP sandbox;
        private, no-store. Нельзя вставлять SVG строку как HTML.
      security:
      - {}
      - sessionCookie: []
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Content-Security-Policy:
              schema:
                type: string
              example: sandbox; default-src 'none'; style-src 'none'; script-src 'none'
            X-Content-Type-Options:
              schema:
                type: string
              example: nosniff
          content:
            image/svg+xml:
              schema:
                type: string
              examples:
                getEventCoverSuccess:
                  value: <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300"><rect width="800" height="300"
                    fill="#D92D3A"/></svg>
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '404':
          $ref: '#/components/responses/404'
        '500':
          $ref: '#/components/responses/500'
        '403':
          $ref: '#/components/responses/403'
      x-access: optional-session
      x-requirements: []
      x-error-codes:
        '400':
        - INVALID_REQUEST
        '401':
        - AUTH_REQUIRED
        - SESSION_EXPIRED
        '404':
        - NOT_FOUND
        '500':
        - INTERNAL_ERROR
        '403':
        - ACCOUNT_BLOCKED
      parameters:
      - $ref: '#/components/parameters/eventId'
      x-scope: MEDIA-01
