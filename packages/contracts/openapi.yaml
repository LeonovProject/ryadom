        DESC, referenceTime=null. UPCOMING — PUBLISHED с startsAt > referenceTime; STARTED_TODAY — PUBLISHED
        с startsAt <= referenceTime и совпадающей датой в IANA-зоне самой встречи. В этих двух окнах сортировка
        event.startsAt/id ASC до LIMIT. STARTED — все PUBLISHED с startsAt <= referenceTime, независимо от
        дня, event.startsAt/id DESC до LIMIT (DEC-15). status независим; главная задаёт CONFIRMED. Первый запрос
        захватывает серверный referenceTime либо использует явный параметр; второй блок передаёт тот же момент.
        Курсор сохраняет время, окно, status, аккаунт и последний ключ. С курсором referenceTime можно опустить;
        иной момент даёт INVALID_CURSOR. Без окна referenceTime запрещён (INVALID_REQUEST). Это опорное время
        чтения, не снимок БД и не время проверки joinEvent/decideParticipation. DEC-14: docs/product/home-proposal.md.'
