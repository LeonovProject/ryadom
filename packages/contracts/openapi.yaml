    EventCapabilities:
      type: object
      additionalProperties: false
      description: Вычисляются сервером при чтении. При now >= startsAt canJoin и canDecideParticipations равны
        false, joinBlockedReason — EVENT_STARTED независимо от сессии/авторства/участия. canManageParticipants
        обозначает доступ автора к чтению состава и не закрывается из-за начала. canPostMessage и canSetCover
        от времени начала не зависят.
      properties:
        canJoin:
          type: boolean
        joinBlockedReason:
          type: string
          nullable: true
          enum:
          - AUTH_REQUIRED
          - ALREADY_ORGANIZER
          - ALREADY_PARTICIPATING
          - EVENT_STARTED
          - null
        canManageParticipants:
          type: boolean
          description: Доступ автора к странице и чтению состава; не разрешение принять или отклонить заявку.
        canDecideParticipations:
          type: boolean
          description: Автор опубликованной встречи и серверное now строго меньше startsAt.
        canPostMessage:
          type: boolean
        canSetCover:
          type: boolean
      required:
      - canJoin
      - joinBlockedReason
      - canManageParticipants
      - canDecideParticipations
      - canPostMessage
      - canSetCover
