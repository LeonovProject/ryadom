      - expectedSeedVersion
      - resetId
      - confirmation
      description: Версия состояния/сида из свежего adminGetDemoState. resetId — новый UUID одного подтверждённого
        действия; сохранить до подтверждения результата, не переотправлять автоматически. Введённое подтверждение
        не заменяет сессию/ADMIN/Origin.
    Email:
      type: string
      format: email
      minLength: 3
      maxLength: 254
      pattern: ^[!-~]+$
      description: ASCII email без пробелов. Для уникальности/входа весь адрес приводится к нижнему регистру.
        Почта не подтверждается.
    LoginInput:
      type: object
      additionalProperties: false
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    RegisterInput:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 15
          maxLength: 128
        presetId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9-]{0,63}$
      required:
      - displayName
      - email
      - password
      - presetId
      description: Email, пароль, имя и обязательный готовый аватар. USER/ACTIVE, PRESET/APPROVED/1 и JWT-сессия
        создаются атомарно. Личный SVG, роль и статус не принимаются.
    AccountStatus:
      type: string
      enum:
      - ACTIVE
      - BLOCKED
    AdminAccount:
      type: object
      additionalProperties: false
      properties:
        account:
          $ref: '#/components/schemas/PublicAccount'
        email:
          $ref: '#/components/schemas/Email'
        systemRole:
          type: string
          enum:
          - USER
          - ADMIN
        status:
          $ref: '#/components/schemas/AccountStatus'
        revision:
          type: integer
          minimum: 1
        blockedAt:
          type: string
          format: date-time
          nullable: true
        blockedByAccountId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
      - account
      - email
      - systemRole
      - status
      - revision
      - blockedAt
      - blockedByAccountId
      - createdAt
    AdminAccountPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminAccount'
        nextCursor:
          type: string
          minLength: 1
          maxLength: 2048
          nullable: true
      required:
      - items
      - nextCursor
    AccountStatusInput:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/AccountStatus'
        expectedRevision:
          type: integer
          minimum: 1
      required:
      - status
      - expectedRevision
