openapi: 3.0.3
info:
  title: Рядом API
  version: 0.13.0
  description: 'Зафиксированный интеграционный контракт для параллельной разработки Go API и React. Реализации
    нет. Поведение: docs/contracts/api-v1.md. MEDIA — отдельное дополнительное оформление, не имитация бизнес-операций.
    DEC-08: жалобы на встречи/сообщения без причины, ручной разбор и восстановление сообщений с защитой от
    устаревших команд. DEC-09: SVG-аватары пользователя с проверкой до публичного показа; готовый каталог/выбор
    avatarId заменены. DEC-10: готовые SVG из общего пустого до получения файлов manifest доступны наряду со
    своей загрузкой. DEC-11: необязательный готовый аватар выбирается при регистрации; аккаунт/аватар/сессия
    атомарны. Свой SVG — позже в профиле. DEC-12: готовый аватар при регистрации обязателен. DEC-13: административный
    сброс демоданных к штатному сиду с подтверждением и квитанцией. DEC-14: личные временные окна будущих встреч
    и начавшихся сегодня, общий referenceTime, сортировка по началу до пагинации. DEC-15: STARTED для всех
    начавшихся встреч в личном списке, по началу и ID по убыванию. DEC-18: последние сообщения с загрузкой
    ранних. DEC-19: календарные фильтры даты в зоне каждого события. DEC-20/21: email/пароль, JWT с отзывом
    по sessions, ADMIN-блокировка USER с сохранением контента. Демопереключение исключено.'
servers:
- url: /api/v1
tags:
- name: Auth
- name: Accounts
- name: Media
- name: Events
- name: Participation
- name: Organizations
- name: Discussion
- name: Admin
- name: Health
- name: Reports
  description: Жалобы на встречи и сообщения, выбранное улучшение DEC-08.
paths:
  /auth/login:
    post:
      operationId: login
      tags:
      - Auth
      summary: Войти по email и паролю
      description: Проверить email/пароль, затем ACTIVE. Неверная пара — одинаковый 401 INVALID_CREDENTIALS;
        правильный пароль BLOCKED — 403 ACCOUNT_BLOCKED. JWT в HttpOnly cookie после commit; 24 часа без refresh.
        Успех заменяет текущую сессию, ошибка входа её не заменяет. Origin обязателен; ограничение попыток
        до проверки Argon2id.
      security: []
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                loginSuccess:
                  value:
                    account:
                      id: 00000001-0000-4000-8000-000000000001
                      displayName: Алексей
                      avatarUrl: /api/v1/accounts/00000001-0000-4000-8000-000000000001/avatar?revision=2
                      isBlocked: false
                    systemRole: USER
                    sessionExpiresAt: '2026-11-02T09:00:00Z'
                    organizations: []
                    email: alex@example.test
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '413':
          $ref: '#/components/responses/413'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      x-access: public
      x-requirements:
      - A1
      x-error-codes:
        '400':
        - INVALID_REQUEST
        '403':
        - CSRF_REJECTED
        - ACCOUNT_BLOCKED
        '413':
        - PAYLOAD_TOO_LARGE
        '415':
        - UNSUPPORTED_MEDIA_TYPE
        '422':
        - VALIDATION_ERROR
        '500':
        - INTERNAL_ERROR
        '429':
        - RATE_LIMITED
        '401':
        - INVALID_CREDENTIALS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
            examples:
              loginSuccess:
                value:
                  email: alex@example.test
                  password: Ryadom-Alex-2026!
      x-requires-origin: true
      x-max-body-bytes: 65536
      x-team-decisions:
      - DEC-20
      - DEC-21
  /auth/register:
    post:
      operationId: register
      tags:
      - Auth
      summary: Создать аккаунт с готовым аватаром
      description: Регистрация доступна независимо от DEMO_MODE. Email ASCII без пробелов, lowercase для UNIQUE;
        пароль 15..128 code points без trim. Имя после trim 1..120, presetId обязателен и существует в manifest.
        Один commit создаёт USER/ACTIVE, PRESET/APPROVED/1 и сессию. Cookie после commit, 201 Me содержит email
        и avatarUrl. Занятый email — 409 EMAIL_TAKEN; ошибочный ID/пустой каталог — 422. Ошибка не оставляет
        частичный аккаунт и не заменяет прежнюю сессию. Свой SVG позднее в профиле. Нет подтверждения почты/восстановления
        пароля. После timeout нет автоматического POST retry; можно войти с введёнными email/паролем.
      security: []
      responses:
        '201':
          description: Создано и сохранено.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                registerSuccess:
                  value:
                    account:
                      id: 00000001-0000-4000-8000-000000000001
                      displayName: Алексей
                      avatarUrl: /assets/avatars/presets/ryadom-companion.svg
                      isBlocked: false
                    systemRole: USER
                    sessionExpiresAt: '2026-11-02T09:00:00Z'
                    organizations: []
                    email: new@example.test
                registerWithPreset:
                  value:
                    account:
                      id: 00000001-0000-4000-8000-000000000001
                      displayName: Алексей
                      avatarUrl: /assets/avatars/presets/ryadom-companion.svg
                      isBlocked: false
                    systemRole: USER
                    sessionExpiresAt: '2026-11-02T09:00:00Z'
                    organizations: []
                    email: new@example.test
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
        '413':
          $ref: '#/components/responses/413'
        '415':
          $ref: '#/components/responses/415'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '500':
          $ref: '#/components/responses/500'
      x-access: public
      x-requirements:
      - A1
      x-error-codes:
        '400':
        - INVALID_REQUEST
        '403':
        - CSRF_REJECTED
        '413':
        - PAYLOAD_TOO_LARGE
        '415':
        - UNSUPPORTED_MEDIA_TYPE
        '422':
        - VALIDATION_ERROR
        '500':
        - INTERNAL_ERROR
        '429':
        - RATE_LIMITED
        '409':
        - EMAIL_TAKEN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
            examples:
              registerSuccess:
                value:
                  displayName: Алексей
                  presetId: ryadom-companion
                  email: new@example.test
                  password: Ryadom-Alex-2026!
              registerWithPreset:
                value:
                  displayName: Алексей
                  presetId: ryadom-companion
                  email: new@example.test
                  password: Ryadom-Alex-2026!
      x-requires-origin: true
      x-max-body-bytes: 65536
      x-team-decisions:
      - DEC-20
      - DEC-21
  /auth/logout:
    post:
      operationId: logout
      tags:
      - Auth
      summary: Завершить сессию
      description: Origin обязателен. Удалить текущую серверную сессию JWT и очистить cookie. Без сессии, с
        неизвестной/истёкшей cookie или BLOCKED — также 204. Выход не разблокирует аккаунт.
      security: []
      responses:
        '204':
          description: Успешно; тело отсутствует.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
        '403':
          $ref: '#/components/responses/403'
        '500':
          $ref: '#/components/responses/500'
        '400':
          $ref: '#/components/responses/400'
      x-access: public
      x-requirements: []
      x-error-codes:
        '403':
        - CSRF_REJECTED
        '500':
        - INTERNAL_ERROR
        '400':
        - INVALID_REQUEST
      x-requires-origin: true
  /me:
    get:
      operationId: getMe
      tags:
      - Accounts
      summary: Текущий аккаунт и организации
      description: Полномочия и список принадлежащих аккаунту организаций для выбора автора. Сессия не продлевается
        чтением.
      security:
      - sessionCookie: []
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                getMeSuccess:
                  value:
                    account:
                      id: 00000001-0000-4000-8000-000000000002
                      displayName: Анна
                      avatarUrl: null
                      isBlocked: false
                    systemRole: USER
                    sessionExpiresAt: '2026-11-02T09:00:00Z'
                    organizations:
                    - id: 00000003-0000-4000-8000-000000000001
                      name: Клуб «Темп»
                      approvalState: APPROVED
                      canPublish: true
                    email: anna@example.test
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
        '400':
          $ref: '#/components/responses/400'
        '403':
          $ref: '#/components/responses/403'
      x-access: session
      x-requirements: []
      x-error-codes:
        '401':
        - AUTH_REQUIRED
        - SESSION_EXPIRED
        '500':
        - INTERNAL_ERROR
        '400':
        - INVALID_REQUEST
        '403':
        - ACCOUNT_BLOCKED
  /accounts/{accountId}:
    get:
      operationId: getAccount
      tags:
      - Accounts
      summary: Публичный профиль
      description: Публичный профиль
      security: []
      responses:
        '200':
          description: Успешно.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicAccount'
              examples:
                getAccountSuccess:
