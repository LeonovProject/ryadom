components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ryadom_session
      description: Подписанный JWT ryadom_session. Сервер проверяет алгоритм/claims, ACTIVE и строку sessions
        в БД; JWT не заменяет отзыв доступа. Swagger отправляет cookie того же origin.
  parameters:
    Limit:
      name: limit
      in: query
      description: Размер страницы. Фильтры применяются до пагинации.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Непрозрачный nextCursor предыдущего ответа. Привязан к маршруту, субъекту, фильтрам и сортировке.
        Не конструировать на клиенте.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    ParticipationEventWindow:
      name: eventWindow
      in: query
      description: Личная временная выборка только PUBLISHED. UPCOMING — startsAt > referenceTime; STARTED_TODAY
        — startsAt <= referenceTime и тот же календарный день в зоне встречи. STARTED — все startsAt <= referenceTime,
        по startsAt/event.id DESC. Только listMyParticipations. Не меняет status; для главной и «Участвую»
        CONFIRMED. Без параметра — полный список по времени создания записи.
      schema:
        type: string
        enum:
        - UPCOMING
        - STARTED_TODAY
        - STARTED
    ParticipationReferenceTime:
      name: referenceTime
      in: query
      description: Только с eventWindow. Опорное время чтения со смещением, например из ответа первого блока;
        сервер возвращает UTC с Z. Без значения на первой странице — серверное время, на следующей — время
        курсора. Явное значение с курсором должно обозначать тот же момент. Не влияет на права мутаций.
      schema:
        type: string
        format: date-time
    Query:
      name: q
      in: query
      schema:
        type: string
        maxLength: 200
    City:
      name: city
      in: query
      schema:
        type: string
        maxLength: 120
    OrganizationId:
      name: organizationId
      in: query
      schema:
        type: string
        format: uuid
    AccountId:
      name: organizerAccountId
      in: query
      schema:
        type: string
        format: uuid
    ActivityTypeId:
      name: activityTypeId
      in: query
      schema:
        type: string
        format: uuid
    JoinMode:
      name: joinMode
      in: query
      schema:
        $ref: '#/components/schemas/JoinMode'
    MessageOrder:
      name: order
      in: query
      description: Только listMessages. NEWEST_FIRST — последние сообщения первыми, nextCursor к ранним. Без
        параметра прежний OLDEST_FIRST. При смене порядка начинать с первой страницы.
      schema:
        type: string
        enum:
        - OLDEST_FIRST
        - NEWEST_FIRST
        default: OLDEST_FIRST
    DateFrom:
      name: dateFrom
      in: query
      description: Только listEvents. Включительная календарная дата начала в IANA-зоне каждого события, YYYY-MM-DD.
        Не дата устройства/сервера. Совместно с from/to через AND.
      schema:
        type: string
        format: date
    DateTo:
      name: dateTo
      in: query
      description: Только listEvents. Исключительная местная дата начала, YYYY-MM-DD. При двух границах dateTo
        > dateFrom; фильтр до пагинации.
      schema:
        type: string
        format: date
    From:
      name: from
      in: query
      description: Включительно; без параметра нижней границы нет.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: Исключительно; при двух границах to > from.
      schema:
        type: string
        format: date-time
    Statuses:
      name: status
      in: query
      style: form
      explode: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ParticipationStatus'
        minItems: 1
        maxItems: 3
        uniqueItems: true
    ApprovalState:
      name: approvalState
      in: query
      schema:
        $ref: '#/components/schemas/ApprovalState'
    PublicationStatus:
      name: publicationStatus
      in: query
      schema:
        $ref: '#/components/schemas/PublicationStatus'
    eventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    accountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    organizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    participationId:
      name: participationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    applicationId:
      name: applicationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    messageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    activityTypeId:
      name: activityTypeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CatalogStatus:
      name: catalogStatus
      in: query
      schema:
        $ref: '#/components/schemas/ActivityTypeCatalogStatus'
    HasOpenReports:
      name: hasOpenReports
      in: query
      schema:
        type: boolean
      description: true — есть OPEN, false — нет OPEN, без параметра все. У встречи учитываются и прямые жалобы,
        и жалобы на сообщения. У сообщения — только его жалобы.
    AvatarRevision:
      name: revision
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
      description: Версия из URL. Несовпадение с текущей версией или недоступный SVG — 404; старый URL не выдаёт
        новое содержимое.
    AvatarStatusFilter:
      name: status
      in: query
      schema:
        type: string
        enum:
        - PENDING
        - APPROVED
        - HIDDEN
      description: Без фильтра все непустые аватары; UI очереди начинает с PENDING. EMPTY не перечисляется.
  headers:
    RequestId:
      description: Идентификатор запроса; совпадает с error.requestId при ошибке.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    NoStore:
      schema:
        type: string
      example: private, no-store
    SessionCookie:
      description: 'JWT-сессия: HttpOnly; Path=/api/v1; SameSite=Lax; Max-Age=86400. Secure при HTTPS, Domain
        отсутствует. При выходе/отзыве Max-Age=0; токен не возвращается в JSON.'
      schema:
        type: string
    RetryAfter:
      description: Число секунд до следующей допустимой попытки, минимум 1.
      schema:
        type: integer
        minimum: 1
  responses:
    '400':
      description: Некорректный JSON, путь, query или курсор.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '401':
      description: Нет сессии либо она истекла. При SESSION_EXPIRED/ACCOUNT_BLOCKED защищённого или optional-session
        маршрута cookie очищается; ошибка нового login прежнюю сессию не заменяет.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Set-Cookie:
          $ref: '#/components/headers/SessionCookie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '403':
      description: Недостаточно системных прав или недопустимый Origin. При SESSION_EXPIRED/ACCOUNT_BLOCKED
        защищённого или optional-session маршрута cookie очищается; ошибка нового login прежнюю сессию не заменяет.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Set-Cookie:
          $ref: '#/components/headers/SessionCookie'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '404':
      description: Ресурс отсутствует или недоступен субъекту.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '409':
      description: Конфликт состояния или решения.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '413':
      description: Превышен предел тела запроса или UTF-8 SVG.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '415':
      description: Ожидался application/json без сжатия.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '422':
      description: Не выполнена валидация полей или содержимого SVG.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '500':
      description: Внутренняя ошибка без раскрытия данных реализации.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '503':
      description: Сервис временно недоступен.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    '429':
      description: Превышено число попыток входа/регистрации.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    PublicAccount:
