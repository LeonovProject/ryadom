  /admin/demo-reset:
    post:
      operationId: adminResetDemoData
      tags:
      - Admin
      summary: Вернуть демобазу к сиду
      description: 'Только ADMIN при DEMO_MODE=true, с Origin и точным подтверждением СБРОСИТЬ. Одна транзакция:
        эксклюзивная блокировка demo_state (максимум ожидания 5 секунд), повторная проверка сессии/ADMIN, expectedGeneration
        и expectedSeedVersion. Несовпадение или повтор последнего resetId — 409 DEMO_STATE_CHANGED, без удаления.
        Не получена блокировка — 409 DEMO_RESET_BUSY. Удалить только десять предметных таблиц фиксированным
        порядком FK, восстановить штатный сид текущей сборки с новой базовой датой Asia/Krasnoyarsk и новыми
        UUID сущностей. Все сессии удалены, включая текущую; подготовленные demoKey alex/anna/marina восстановлены.
        Обновить generation новым UUID и записать квитанцию в сохраняемую demo_state тем же commit. Миграции/схема/конфигурация/статический
        manifest не сбрасываются. Не SQL/shell/загрузка произвольного дампа. Любая ошибка откатывает весь сброс,
        данные/сессии/generation прежние. 200 и очищающая cookie только после commit; после успеха вход заново.
        Автоматического retry нет: для восстановления результата после повторного входа читать adminGetDemoState.
        Остальные операции с бизнес-данными/сессиями держат shared-барьер demo_state первым в своей транзакции
        и проверяют права после него: операции после сброса не применяют старую сессию к восстановленным данным.
        Лимит тела 64 КиБ. При DEMO_MODE=false маршрут 404; это требование к будущему приложению, не команда
        выполнить сброс сейчас.'
      security:
      - sessionCookie: []
      responses:
        '200':
