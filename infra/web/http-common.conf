include /etc/nginx/mime.types;
default_type application/octet-stream;
server_tokens off;
# Do not log query strings, cookies, request bodies or forwarding headers.
log_format safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
access_log /dev/stdout safe;
client_max_body_size 1048576;
client_body_timeout 15s;
client_header_timeout 10s;
keepalive_timeout 30s;
client_body_temp_path /tmp/client-body;
proxy_temp_path /tmp/proxy;
fastcgi_temp_path /tmp/fastcgi;
uwsgi_temp_path /tmp/uwsgi;
scgi_temp_path /tmp/scgi;
root /usr/share/nginx/html;
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;
upstream api_backend {
    zone api_backend 64k;
    server api:8080 resolve;
    keepalive 16;
}
