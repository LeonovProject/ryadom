pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/http-common.conf;
    # Internal health only; this port is not published in the HTTPS override.
    server {
        listen 8080;
        location = /_health { access_log off; return 200 'ok'; }
        location / { return 404; }
    }
    server {
        listen 8443 ssl;
        http2 on;
        server_name _;
        ssl_certificate /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:1m;
        ssl_session_tickets off;
        include /etc/nginx/routes.conf;
    }
}
