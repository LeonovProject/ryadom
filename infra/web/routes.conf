include /etc/nginx/headers.conf;
location = /_health { access_log off; default_type text/plain; return 200 'ok'; }
# Backend health/readiness are internal; they are not a public product API.
location ^~ /api/v1/health/ { error_page 404 = @api_not_found; return 404; }
location = /api/v1 { include /etc/nginx/proxy.conf; }
location ^~ /api/v1/ { include /etc/nginx/proxy.conf; }
location = /api/docs { return 308 /api/docs/; }
location ^~ /api/docs/ {
    include /etc/nginx/headers.conf;
    add_header Cache-Control no-cache always;
    try_files $uri $uri/ =404;
}
location = /api/openapi.yaml {
    include /etc/nginx/headers.conf;
    default_type application/yaml;
    add_header Cache-Control no-cache always;
    try_files $uri =404;
}
location ^~ /api/ { error_page 404 = @api_not_found; return 404; }
location /assets/ {
    include /etc/nginx/headers.conf;
    add_header Cache-Control no-cache always;
    try_files $uri =404;
}
location / {
    include /etc/nginx/headers.conf;
    add_header Cache-Control no-cache always;
    try_files $uri $uri/ /index.html;
}
location @api_not_found {
    include /etc/nginx/headers.conf;
    default_type application/json;
    add_header Cache-Control 'private, no-store' always;
    add_header X-Request-ID $request_id always;
    return 404 '{"error":{"code":"NOT_FOUND","message":"Ресурс не найден.","requestId":"$request_id","fieldErrors":{}}}';
}
location @api_too_large {
    include /etc/nginx/headers.conf;
    default_type application/json;
    add_header Cache-Control 'private, no-store' always;
    add_header X-Request-ID $request_id always;
    return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"Превышен предел тела запроса.","requestId":"$request_id","fieldErrors":{}}}';
}
location @api_unavailable {
    include /etc/nginx/headers.conf;
    default_type application/json;
    add_header Cache-Control 'private, no-store' always;
    add_header X-Request-ID $request_id always;
    return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Сервис временно недоступен.","requestId":"$request_id","fieldErrors":{}}}';
}
